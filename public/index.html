<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>routine-tracker</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <button id="theme-toggle">🌙 Dark mode</button>
  <h1>Tracker of old and potentially new routines</h1>

  <div id="auth-section" class="hidden">
    <label for="auth-username">Username</label>
    <input type="text" id="auth-username" placeholder="Username">
    <label for="auth-password">Password</label>
    <input type="password" id="auth-password" placeholder="Password">
    <button id="login-button">Log in</button>
    <button id="signup-button">Sign up</button>
    <p id="auth-error"></p>
  </div>

  <div id="app-section" class="hidden">
    <button id="logout-button">Log out</button>
    <ul id="habit-list"></ul>

    <form id="add-habit-form">
      <label for="new-habit-name">New habit</label>
      <input type="text" id="new-habit-name" placeholder="New habit..." required>
      <button type="submit">Add habit</button>
      <p id="habit-error"></p>
    </form>

    <div id="admin-section" class="hidden">
      <button id="admin-stats-button">View all users' stats</button>
      <ul id="admin-stats-list"></ul>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
